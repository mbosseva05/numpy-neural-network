[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numpy-nn"
version = "0.1.0"
description = "A small neural network library written from scratch with NumPy"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Martina Bosseva" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
examples = ["scikit-learn>=1.0", "matplotlib>=3.5"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
